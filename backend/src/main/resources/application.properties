spring.application.name=catchbus-backend
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BusReservationDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Password}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jackson.serialization.write-dates-as-timestamps=false
spring.sql.init.mode=never

app.jwt.secret=${JWT_SECRET:CatchBusLK-Change-This-Secret-To-A-Long-Random-Value-At-Least-32-Bytes}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
app.demo-seed=${DEMO_SEED:true}
