<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Ticket Booking — Available Trips</title>
    <meta name="description" content="Search and book bus tickets online. Choose your route, select seats, and confirm your booking instantly.">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <header class="navbar">
        <a href="/" class="brand">
            <div class="brand-icon">🚌</div>
            Bus Booking
        </a>
        <nav class="nav-links">
            <a href="/" class="nav-link">Available Trips</a>
        </nav>
    </header>

    <main class="container">

        <div class="hero">
            <h1>Available Bus Trips</h1>
            <p>Select a route below to view the seating layout and book your seats.</p>
        </div>

        <div class="trips-grid">
            <div th:each="trip : ${trips}" class="trip-card">

                <span class="operator-badge" th:text="${trip.bus.operatorName}">Operator</span>

                <div class="route-info">
                    <div class="city-box">
                        <div class="city-name" th:text="${trip.source}">Origin</div>
                        <div class="city-time" th:text="${#temporals.format(trip.departureTime, 'dd MMM yyyy, HH:mm')}">Departure</div>
                    </div>

                    <div class="route-arrow">
                        <span>&#8594;</span>
                        <small th:text="${trip.bus.busType}" style="font-size:0.7rem; color:var(--text-light); text-align:center; max-width:90px; line-height:1.3;">Bus Type</small>
                    </div>

                    <div class="city-box dest">
                        <div class="city-name" th:text="${trip.destination}">Destination</div>
                        <div class="city-time" th:text="${#temporals.format(trip.arrivalTime, 'dd MMM yyyy, HH:mm')}">Arrival</div>
                    </div>
                </div>

                <div class="trip-meta">
                    <div>
                        <div class="price-label">Starting from</div>
                        <div class="price-tag" th:text="'Rs ' + ${#numbers.formatDecimal(trip.basePrice, 1, 'COMMA', 0, 'POINT')}">Rs 0</div>
                    </div>
                    <a th:href="@{/booking/{id}(id=${trip.id})}" class="btn-book">Select Seats &rarr;</a>
                </div>

            </div>
        </div>

    </main>

</body>
</html>
