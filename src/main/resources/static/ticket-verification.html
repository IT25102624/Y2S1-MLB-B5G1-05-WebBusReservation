<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CatchBusLK | Verify Ticket</title>
<style>:root{--blue:#2563eb;--navy:#0f172a;--muted:#64748b;--line:#e2e8f0;--green:#16a34a;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--navy);font-family:Inter,Segoe UI,sans-serif}header{height:68px;background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100% - 1000px)/2))}header strong{font-size:20px}header a{color:#cbd5e1;text-decoration:none}main{max-width:1000px;margin:38px auto;padding:0 20px}.grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:24px}.card{min-width:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 10px 30px #0f172a0d}h1{margin:0 0 8px;font-size:27px}p{color:var(--muted);line-height:1.55}.upload{display:block;width:100%;border:2px dashed #94a3b8;border-radius:14px;padding:30px 15px;text-align:center;margin:22px 0;cursor:pointer;background:#f8fafc;overflow:hidden}.upload:hover{border-color:var(--blue);background:#eff6ff}.upload input{display:none}.upload strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.upload p{margin:8px 0 0}.icon{font-size:44px}.btn{border:0;border-radius:10px;padding:13px 18px;font-weight:800;font-size:14px;cursor:pointer;width:100%}.primary{background:var(--blue);color:#fff}.success{background:var(--green);color:#fff}.btn:disabled{opacity:.55}.message{display:none;padding:12px;border-radius:9px;margin:14px 0;font-size:13px}.error{background:#fef2f2;border:1px solid #fecaca;color:#b91c1c}.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}.empty{display:grid;place-items:center;min-height:400px;text-align:center;color:#94a3b8}.status{display:inline-block;padding:6px 12px;border-radius:20px;font-weight:850;font-size:12px}.valid{background:#dcfce7;color:#166534}.verified{background:#dbeafe;color:#1d4ed8}.details{display:none}.details h2{margin:0 0 16px}.route{background:#eff6ff;border-radius:12px;padding:17px;font-weight:850;font-size:19px;margin-bottom:20px}.rows{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;font-size:14px}.rows span:nth-child(odd){color:var(--muted)}.rows span:nth-child(even){font-weight:700;overflow-wrap:anywhere}.confirm{margin-top:24px}.warning{background:#fff7ed;color:#9a3412;padding:12px;border-radius:9px;font-size:13px;margin-top:15px}@media(max-width:760px){.grid{grid-template-columns:1fr}header strong{font-size:16px}}@media(max-width:420px){main{padding:0 12px}.card{padding:18px}.rows{grid-template-columns:105px minmax(0,1fr)}}</style></head>
<body><header><strong>🛂 CatchBusLK Ticket Verification</strong><a href="admin.html">Back to dashboard</a></header><main><div class="grid"><section class="card"><h1>Scan passenger QR</h1><p>Upload the passenger's QR ticket to check its status and journey details.</p><label class="upload" id="drop"><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><div class="icon">▣</div><strong id="fileLabel">Choose or drop QR image</strong><p>PNG, JPG or WebP</p></label><div id="error" class="message error"></div><button id="scan" class="btn primary">Scan and retrieve ticket</button></section><section class="card"><div id="empty" class="empty"><div><div class="icon">🎫</div><h2>No ticket scanned</h2><p>Ticket information will appear here.</p></div></div><div id="details" class="details"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><h2>Ticket details</h2><span id="status" class="status"></span></div><div id="route" class="route"></div><div id="rows" class="rows"></div><div id="confirmed" class="message ok"></div><button id="approve" class="btn primary confirm" style="display:none">Approve ticket</button><button id="confirm" class="btn success confirm">Confirm passenger boarding</button></div></section></div></main>
<script>
const API='/api/v1';let ticket;
const file=document.getElementById('file'),drop=document.getElementById('drop'),error=document.getElementById('error');
const authToken=localStorage.getItem('bus_jwt_token');let currentUser=null;try{currentUser=JSON.parse(localStorage.getItem('bus_user'))}catch(e){}
const role=String(currentUser?.role||'').toUpperCase(),isAdmin=role==='ADMIN';
const authHeaders=json=>({...json?{'Content-Type':'application/json'}:{},...(authToken?{Authorization:`Bearer ${authToken}`}:{})});
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
file.onchange=()=>document.getElementById('fileLabel').textContent=file.files[0]?.name||'Choose or drop QR image';drop.ondragover=e=>{e.preventDefault();drop.style.borderColor='#2563eb'};drop.ondragleave=()=>drop.style.borderColor='';drop.ondrop=e=>{e.preventDefault();drop.style.borderColor='';file.files=e.dataTransfer.files;file.onchange()};
function showError(m){error.textContent=m;error.style.display='block'}
document.getElementById('scan').onclick=async()=>{if(!authToken)return showError('Sign in as an administrator or conductor first.');if(!file.files[0])return showError('Select a QR image first.');const b=document.getElementById('scan');b.disabled=true;b.textContent='Scanning…';error.style.display='none';const form=new FormData();form.append('qrImage',file.files[0]);try{const r=await fetch(`${API}/payments/tickets/scan`,{method:'POST',headers:authHeaders(false),body:form}),j=await r.json();if(!r.ok)throw Error(j.message||'Could not scan QR');ticket=j.data;render()}catch(e){document.getElementById('details').style.display='none';showError(e.message)}finally{b.disabled=false;b.textContent='Scan and retrieve ticket'}};
function render(){document.getElementById('empty').style.display='none';document.getElementById('details').style.display='block';const verified=ticket.verificationStatus==='VERIFIED',refunded=ticket.verificationStatus==='REFUNDED'||ticket.bookingStatus==='CANCELLED',approved=ticket.approvalStatus==='APPROVED',s=document.getElementById('status');s.textContent=refunded?'REFUNDED — NOT VALID':verified?'BOARDED':approved?'VALID':'PENDING';s.className='status '+(refunded?'verified':approved?'valid':'verified');document.getElementById('route').textContent=`${ticket.sourceCity} → ${ticket.destinationCity}`;const values=[['Booking',`#${ticket.bookingId}`],['Passenger',ticket.passengerName],['Phone',ticket.passengerPhone],['Bus',`${ticket.busNumber} · ${ticket.operatorName}`],['Seats',ticket.seats.join(', ')],['Departure',new Date(ticket.departureTime).toLocaleString()],['Boarding',ticket.boardingPoint],['Destination',ticket.destinationPoint],['Paid',`LKR ${Number(ticket.totalAmount).toFixed(2)}`],['Refund protection',ticket.refundFeePaid?'PAID (LKR 150.00)':'NOT PURCHASED'],['Ticket issued',new Date(ticket.issuedAt).toLocaleString()]];if(ticket.refund)values.push(['Refund',`${ticket.refund.refundStatus} · LKR ${Number(ticket.refund.refundAmount).toFixed(2)}`]);document.getElementById('rows').innerHTML=values.map(v=>`<span>${esc(v[0])}</span><span>${esc(v[1])}</span>`).join('');document.getElementById('approve').style.display=isAdmin&&!approved&&!refunded?'block':'none';document.getElementById('confirm').style.display=approved&&!verified&&!refunded&&role==='CONDUCTOR'?'block':'none';const c=document.getElementById('confirmed');if(refunded){c.textContent='Refund completed. This QR ticket is no longer valid for boarding.';c.style.display='block';c.className='message error'}else if(verified){c.textContent=`Boarding confirmed${ticket.verifiedBy?' by '+ticket.verifiedBy:''}.`;c.style.display='block';c.className='message ok'}else c.style.display='none'}
async function post(path,body,method='POST'){error.style.display='none';const r=await fetch(`${API}${path}`,{method,headers:authHeaders(true),body:body===undefined?undefined:JSON.stringify(body)}),j=await r.json();if(!r.ok)throw Error(j.message||'Operation failed');return j.data}
document.getElementById('approve').onclick=async()=>{try{ticket=await post(`/payments/tickets/${encodeURIComponent(ticket.ticketToken)}/approve`);render()}catch(e){showError(e.message)}};
document.getElementById('confirm').onclick=async()=>{try{ticket=await post(`/payments/tickets/${encodeURIComponent(ticket.ticketToken)}/confirm`,{verifiedBy:currentUser?.fullName||'Conductor'});render()}catch(e){showError(e.message)}};
</script></body></html>
