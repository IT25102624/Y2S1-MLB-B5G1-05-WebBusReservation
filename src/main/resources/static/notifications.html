<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <link rel="stylesheet" href="css/srilanka-travel.css">
</head>
<body>
    <nav class="top-nav">
        <a class="brand" href="index.html">LankaRide Support Module</a>
        <div class="nav-links">
            <a href="search.html">Search Buses</a>
            <a href="luggage.html">Luggage</a>
            <a href="feedback.html">Feedback</a>
            <a href="notifications.html">Alerts</a>
            <a href="login.html" id="loginLink">Login</a>
            <button id="logoutBtn" class="hidden">Logout</button>
        </div>
    </nav>
    <main class="container">
        <section class="panel">
            <h1>Notifications & Alerts</h1>
            <p id="message" class="message"></p>
            <button id="markAllBtn" class="button secondary" type="button">Mark All Read</button>
            <div id="notificationList" class="form-grid" style="margin-top:18px"></div>
        </section>
    </main>
    <script src="js/app.js"></script>
    <script>
        const user = requireUser();
        setupNav('notifications.html');
        if (user) loadNotifications();

        markAllBtn.addEventListener('click', async () => {
            const uid = user.id || user.userId || 2;
            await fetch(`/api/v1/notifications/user/${uid}/read-all`, { method: 'PUT' });
            showMessage('Notifications updated.');
            loadNotifications();
        });

        async function loadNotifications() {
            const uid = user.id || user.userId || 2;
            const response = await fetch(`/api/v1/notifications/user/${uid}`);
            const notifications = await response.json();
            notificationList.innerHTML = notifications.length ? notifications.map(notification => `
                <article class="item">
                    <span class="tag">${notification.isRead ? 'READ' : 'NEW'}</span>
                    <h3>${notification.type}</h3>
                    <p>${notification.message}</p>
                    <small>${formatDateTime(notification.createdAt)}</small>
                    ${notification.isRead ? '' : `<p><button class="button secondary" onclick="markRead(${notification.id})">Mark Read</button></p>`}
                </article>
            `).join('') : '<p>No notifications yet.</p>';
        }

        async function markRead(id) {
            await fetch(`/api/v1/notifications/${id}/read`, { method: 'PUT' });
            loadNotifications();
        }
    </script>
</body>
</html>
