<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Route & Schedule Search | Web Bus Reservation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #dc2626;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            max-width: 1080px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 28px;
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            color: #1e293b;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .search-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 24px;
            margin-bottom: 28px;
            border: 1px solid var(--border);
        }

        .search-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.875rem;
            font-weight: 600;
            color: #334155;
        }

        .form-group select,
        .form-group input {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            padding: 10px 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-outline:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .results-header h2 {
            font-size: 1.25rem;
            color: #1e293b;
        }

        .trip-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .trip-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            padding: 20px;
            display: grid;
            grid-template-columns: 2fr 3fr 1.5fr 1.5fr;
            align-items: center;
            gap: 20px;
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .trip-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        .bus-info h3 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
        }

        .bus-info .operator {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 6px;
        }

        .badge-ac { background: #e0f2fe; color: #0369a1; }
        .badge-luxury { background: #fef3c7; color: #b45309; }
        .badge-sleeper { background: #ede9fe; color: #6d28d9; }
        .badge-nonac { background: #f1f5f9; color: #475569; }

        .time-route {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .time-box .time {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
        }

        .time-box .city {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .duration-arrow {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            min-width: 90px;
        }

        .duration-arrow .line {
            height: 2px;
            background: #cbd5e1;
            margin: 4px 0;
            position: relative;
        }

        .duration-arrow .line::after {
            content: '▶';
            position: absolute;
            right: -4px;
            top: -6px;
            font-size: 8px;
            color: #94a3b8;
        }

        .seats-info {
            text-align: center;
        }

        .seats-info .seats-count {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--success);
        }

        .seats-info .seats-label {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .fare-action {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .fare-action .price {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--primary);
        }

        .fare-action .price span {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        .loading, .empty-state, .error-banner {
            background: white;
            padding: 40px;
            border-radius: var(--radius);
            text-align: center;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .error-banner {
            color: var(--danger);
            background: #fef2f2;
            border-color: #fecaca;
            margin-bottom: 20px;
            display: none;
        }

        @media (max-width: 768px) {
            .trip-card {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .time-route {
                justify-content: space-between;
            }
            .fare-action {
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚍 Web Bus Ticket Reservation System</h1>
            <p>Module 2: Search Bus Schedules & Available Routes (IT25102624)</p>
        </header>

        <div id="errorBanner" class="error-banner"></div>

        <section class="search-card">
            <form id="searchForm">
                <div class="search-grid">
                    <div class="form-group">
                        <label for="sourceCity">From (Origin)</label>
                        <select id="sourceCity" name="sourceCity" required>
                            <option value="">Loading origin cities...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="destinationCity">To (Destination)</label>
                        <select id="destinationCity" name="destinationCity" required>
                            <option value="">Loading destination cities...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="travelDate">Travel Date</label>
                        <input type="date" id="travelDate" name="travelDate" required>
                    </div>

                    <div class="form-group">
                        <label for="busType">Bus Type (Optional)</label>
                        <select id="busType" name="busType">
                            <option value="">All Bus Types</option>
                            <option value="AC">AC</option>
                            <option value="LUXURY">Luxury</option>
                            <option value="SLEEPER">Sleeper</option>
                            <option value="NON_AC">Non-AC</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="sortBy">Sort By</label>
                        <select id="sortBy" name="sortBy">
                            <option value="departureAsc">Departure Time (Earliest First)</option>
                            <option value="departureDesc">Departure Time (Latest First)</option>
                            <option value="fareAsc">Price (Lowest First)</option>
                            <option value="fareDesc">Price (Highest First)</option>
                        </select>
                    </div>
                </div>

                <div class="actions">
                    <button type="button" class="btn btn-outline" id="btnReset">Clear</button>
                    <button type="submit" class="btn btn-primary" id="btnSearch">Search Bus Schedules</button>
                </div>
            </form>
        </section>

        <div class="results-header">
            <h2>Available Schedules</h2>
            <span id="resultsCount" style="color: var(--text-muted); font-size: 0.9rem;"></span>
        </div>

        <div id="resultsContainer" class="trip-list">
            <div class="empty-state">Select origin, destination, and travel date above to view live schedules.</div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1/search';

        // Set default date to tomorrow
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        const tomorrowStr = tomorrow.toISOString().split('T')[0];
        document.getElementById('travelDate').value = tomorrowStr;
        document.getElementById('travelDate').min = new Date().toISOString().split('T')[0];

        // Load searchable cities from API
        async function loadCities() {
            try {
                const res = await fetch(`${API_BASE}/cities`);
                const json = await res.json();
                if (json.success && json.data) {
                    const srcSelect = document.getElementById('sourceCity');
                    const destSelect = document.getElementById('destinationCity');

                    srcSelect.innerHTML = '<option value="">Select Origin City</option>' +
                        json.data.sourceCities.map(c => `<option value="${c}">${c}</option>`).join('');

                    destSelect.innerHTML = '<option value="">Select Destination City</option>' +
                        json.data.destinationCities.map(c => `<option value="${c}">${c}</option>`).join('');

                    // Default selection for immediate testing
                    srcSelect.value = 'Colombo';
                    destSelect.value = 'Kandy';
                }
            } catch (err) {
                showError('Failed to load city list from backend API.');
            }
        }

        // Search Trips
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideError();

            const source = document.getElementById('sourceCity').value;
            const dest = document.getElementById('destinationCity').value;
            const date = document.getElementById('travelDate').value;
            const busType = document.getElementById('busType').value;
            const sortBy = document.getElementById('sortBy').value;

            const params = new URLSearchParams({
                sourceCity: source,
                destinationCity: dest,
                travelDate: date
            });

            if (busType) params.append('busType', busType);
            if (sortBy) params.append('sortBy', sortBy);

            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div class="loading">Searching available bus schedules in SSMS database...</div>';
            document.getElementById('resultsCount').textContent = '';

            try {
                const res = await fetch(`${API_BASE}/trips?${params.toString()}`);
                const json = await res.json();

                if (!res.ok) {
                    throw new Error(json.message || 'Error occurred while searching schedules.');
                }

                renderResults(json.data || []);
            } catch (err) {
                showError(err.message);
                container.innerHTML = `<div class="empty-state" style="color: var(--danger);">${err.message}</div>`;
            }
        });

        function renderResults(trips) {
            const container = document.getElementById('resultsContainer');
            document.getElementById('resultsCount').textContent = `${trips.length} bus(es) found`;

            if (!trips || trips.length === 0) {
                container.innerHTML = '<div class="empty-state">No scheduled trips found matching your search criteria.</div>';
                return;
            }

            container.innerHTML = trips.map(t => {
                const dep = new Date(t.departureTime);
                const arr = new Date(t.arrivalTime);

                const depTimeStr = dep.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const arrTimeStr = arr.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                const badgeClass = t.busType === 'AC' ? 'badge-ac'
                    : t.busType === 'LUXURY' ? 'badge-luxury'
                    : t.busType === 'SLEEPER' ? 'badge-sleeper' : 'badge-nonac';

                return `
                    <div class="trip-card">
                        <div class="bus-info">
                            <h3>${t.busNumber}</h3>
                            <div class="operator">${t.operatorName}</div>
                            <span class="badge ${badgeClass}">${t.busType}</span>
                        </div>

                        <div class="time-route">
                            <div class="time-box">
                                <div class="time">${depTimeStr}</div>
                                <div class="city">${t.sourceCity}</div>
                            </div>
                            <div class="duration-arrow">
                                <div>${t.estimatedDurationHours} hrs</div>
                                <div class="line"></div>
                                <div>Express</div>
                            </div>
                            <div class="time-box">
                                <div class="time">${arrTimeStr}</div>
                                <div class="city">${t.destinationCity}</div>
                            </div>
                        </div>

                        <div class="seats-info">
                            <div class="seats-count">${t.availableSeats}</div>
                            <div class="seats-label">Seats Available (out of ${t.totalSeats})</div>
                        </div>

                        <div class="fare-action">
                            <div class="price">LKR ${t.baseFare.toLocaleString('en-US', { minimumFractionDigits: 2 })} <span>/ seat</span></div>
                            <button class="btn btn-primary" onclick="alert('Trip #' + ${t.tripId} + ' selected! This connects to Module 3: Seat Selection.')">Select Seats</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function showError(msg) {
            const banner = document.getElementById('errorBanner');
            banner.textContent = msg;
            banner.style.display = 'block';
        }

        function hideError() {
            const banner = document.getElementById('errorBanner');
            banner.style.display = 'none';
        }

        document.getElementById('btnReset').addEventListener('click', () => {
            document.getElementById('searchForm').reset();
            document.getElementById('travelDate').value = tomorrowStr;
            loadCities();
            document.getElementById('resultsContainer').innerHTML = '<div class="empty-state">Select origin, destination, and travel date above to view live schedules.</div>';
            document.getElementById('resultsCount').textContent = '';
            hideError();
        });

        // Initialize cities on page load
        loadCities();
    </script>
</body>
</html>
